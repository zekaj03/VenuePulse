<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VenuePulse - Capacity Monitoring</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
        font-family: 'Outfit', sans-serif;
    }

    @keyframes fade-in-out {
      0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
      10% { opacity: 1; transform: translateY(0) scale(1); }
      90% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(0.95); }
    }
    .capacity-alert {
      animation: fade-in-out 4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    @keyframes drift {
        0% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(30px, -50px) rotate(2deg); }
        66% { transform: translate(-20px, 20px) rotate(-2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }
    
    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    body {
        background-color: #f0f4f8; /* Slightly darker base for light mode to pop the glass */
        overflow-x: hidden;
    }
    
    /* Liquid Background mesh */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200vw;
      height: 200vh;
      z-index: -2;
      background: 
        radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
      background-size: 150% 150%;
      animation: gradient-shift 20s ease infinite;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
            radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        animation: drift 20s ease-in-out infinite alternate;
        pointer-events: none;
    }

    body.dark {
        background-color: #0f172a;
    }
    
    body.dark::before {
        opacity: 1;
    }

    /* Light mode gradient - softer for readability */
    body:not(.dark)::before {
        background: 
            radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%), 
            radial-gradient(at 50% 100%, hsla(280, 100%, 96%, 1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(340, 100%, 96%, 1) 0, transparent 50%);
        opacity: 1;
    }

    /* Glass Scrollbar */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent; 
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3); 
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5); 
    }
    
    /* Utility for glass cards */
    .glass-panel {
        background: rgba(255, 255, 255, 0.85); /* Increased opacity for light mode readability */
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05); /* Softer, more diffuse shadow */
    }
    
    body.dark .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-900 dark:text-slate-100 transition-colors duration-500 antialiased selection:bg-cyan-500/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
